# Builds the Audere client installer and attaches it to a GitHub Release.
#
# Triggered by pushing a version tag:
#
#     git tag v1.0.0
#     git push origin v1.0.0
#
# Can also be started by hand from the Actions tab, which is handy for
# checking the build works before committing to a tag.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  # Needed to create the release and upload files to it.
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Without this every run recompiles the whole dependency tree.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      # The bundler that produces the .msi lives in the Tauri CLI, not cargo.
      # Cached separately because `cargo install` is slow and rarely changes.
      - name: Cache Tauri CLI
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-v2-${{ runner.os }}

      - name: Install Tauri CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2.0" --locked

      # WiX is fetched automatically on first use and produces the installer.
      - name: Build installer
        working-directory: client
        run: cargo tauri build

      - name: Stage release files
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $version) { $version = 'dev' }
          $msi = Get-ChildItem client/src-tauri/target/release/bundle/msi/*.msi |
            Select-Object -First 1
          if (-not $msi) { throw 'No .msi produced' }
          $name = "Audere-$version-x64.msi"
          Copy-Item $msi.FullName $name
          # A checksum lets people verify the download is intact and unaltered.
          (Get-FileHash $name -Algorithm SHA256).Hash |
            Out-File "$name.sha256" -Encoding ascii

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            Audere-*.msi
            Audere-*.msi.sha256
