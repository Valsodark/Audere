# RNNoise compiled to WASM for the mic noise-suppression worklet.
#
# Build (needs `rustup target add wasm32-unknown-unknown`):
#   cargo build --release --target wasm32-unknown-unknown
# then copy target/wasm32-unknown-unknown/release/concord_noise.wasm
# to ../ui/rnnoise.wasm, where the client embeds it.
#
# The built artifact is committed so normal client builds don't need the
# wasm toolchain; rebuild only when this crate changes.

[package]
name = "concord-noise"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
nnnoiseless = { version = "0.5", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
